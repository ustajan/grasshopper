# Builds grasshopper against the conda-forge Geant4 package on Linux and macOS,
# runs the smoke test, and installs the GUI package. This mirrors exactly what
# the conda-forge recipe does, so a green run here means the recipe will build.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: g4
          cache-environment: true
          create-args: >-
            -c conda-forge
            geant4=11.4.3
            xerces-c clhep expat zlib
            cmake ninja cxx-compiler
            python>=3.10 pip setuptools tk numpy matplotlib-base platformdirs

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja $CMAKE_ARGS
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX"
          -DWITH_GEANT4_UIVIS=OFF
          -DWITH_ROOT=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build

      - name: Smoke test the installed binary
        run: |
          grasshopper --version
          grasshopper --help
          bash tests/smoke_test.sh grasshopper "$CONDA_PREFIX/share/grasshopper"

      - name: Install and check the GUI package
        run: |
          python -m pip install --no-deps --no-build-isolation .
          grasshopper-gui --version
          python -c "import grasshopper_gui, grasshopper_gui.app, grasshopper_gui.novis"
